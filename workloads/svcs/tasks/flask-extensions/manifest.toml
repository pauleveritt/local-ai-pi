substantive = "Changes a public storage location other code reads, and is the kind of migration that breaks callers if done partially."
writable_bounded = "src/svcs/** only; the Flask integration module lives there."
adaptations = "None. The two touched tests are existing tests whose assertions moved from config to extensions; the file is taken whole at target."

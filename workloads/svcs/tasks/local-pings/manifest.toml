task_id = "local-pings"
role = "medium"
axes = ["override-semantics", "discovery"]

[source]
upstream = "https://github.com/hynek/svcs"
base_sha = "31bc6dfd5d1a570b3b96cfefd878ccc686bde980"
target_sha = "52c6689d34ce80c0f5a754f95d2aad54837402df"

[task]
brief = "brief.md"
brief_sha256 = "60b0e1b0922f923ef0ab0fdcf10c527bb095a1a95364aaf0accf7aed7cebead1"
contract_version = 1

[policy]
readable = ["src/**", "tests/**", "docs/**", "README.md", "CHANGELOG.md"]
writable = ["src/svcs/**"]
candidate_output = ["src/svcs/_core.py"]

[oracle]
files = ["tests/test_container.py"]
command = ["pytest", "-q", "-p", "no:cacheprovider", "tests/test_container.py"]

[oracle.rejection]
# The base already has register_local_factory and get_pings, so the oracle
# collects cleanly and fails on assertions rather than at import.
class = "assertion-failure"
missing_symbols = []
failing_nodes = [
  "tests/test_container.py::TestServicePing::test_local_pings_are_retrieved",
  "tests/test_container.py::TestServicePing::test_local_pings_override_global_pings",
  "tests/test_container.py::TestServicePing::test_local_services_without_pings_discard_global_pings",
]

[oracle.files_sha256]
"tests/test_container.py" = "04a02af3fe4cee1fb91183ea05f8c78492cd7fd3ddcdc27801cfa566d7a57fa3"

[preservation]
command = ["pytest", "-q", "-p", "no:cacheprovider"]
deselects = []
deselect_reason = ""

[environment]
id = "svcs-cohort-2026-08-09"
python = "3.14.2"
lock_sha256 = "6d0058e19259c2d68b597096b17e33e7816c00f2cf49f6772af769e30a1d37c3"

[attestations]
behavior_not_structure = "The oracle calls the public Container.register_local_factory and Container.get_pings, then invokes the returned pings and asserts on Mock call counts. It never inspects container internals, private attributes, or how registrations are stored."
statable_behaviorally = "The brief describes which pings get_pings() reports for locally registered services, including that a local registration without a ping suppresses a shadowed registry ping. Upstream's own CHANGELOG states the same three behaviours in the same user-facing terms, which is evidence they are statable without revealing the patch. The brief names no file, no attribute, and no data structure."
substantive = "Changes which services a public API reports, and adds override precedence between local and registry registrations. Not formatting, not a rename, not typing cleanup."
writable_bounded = "src/svcs/** only, chosen from the library's own layout before any model output existed. The oracle exercises Container behaviour, which lives in that package."
adaptations = "None. The oracle is the upstream test file at the target commit, unmodified. It also carries an unrelated refactor from the same commit -- a make_ping_stub fixture replacing an inline Mock in the pre-existing test_ping -- which is inherited rather than adapted."

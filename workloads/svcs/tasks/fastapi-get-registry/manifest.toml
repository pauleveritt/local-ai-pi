[attestations]
behavior_not_structure = "The oracle calls the new public get_registry() with an app and with a test client and compares the result to the registry request-scoped code receives. It does not reach into app state directly."
statable_behaviorally = "The brief lists the observable requirements -- same object as request code sees, composed lifespans, test client, clear error when absent, nothing after shutdown -- without naming where the registry is stored or how it is found."
substantive = "Adds a public function to two integrations and must behave identically in both. The most cross-cutting task below the ceiling."
writable_bounded = "src/svcs/** only; both integration modules live there."
adaptations = "typing_tests/ and docs/examples/ are changed by the same commit but are not part of the oracle: they are read by type checkers and doc builds, not collected by this command. pyproject.toml and uv.lock also change; the cohort environment is frozen and shared across arms, so the task is qualified against that environment rather than the commit's own."

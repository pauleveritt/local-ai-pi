# The svcs replay cohort.
#
# `tasks` is the candidate ladder -- everything qualification runs against.
# `included` and `excluded` are the frozen *result* of that run, and an
# exclusion without a written reason is not allowed to exist: "record every
# exclusion" is a property of this file's shape rather than something to
# remember at write-up time.
#
# Both lists are empty until Task 8 curates and qualifies. Once frozen,
# running with --frozen requires every candidate to appear in exactly one
# of them.
name = "svcs"
upstream = "https://github.com/hynek/svcs"
env = "env"

tasks = [
  "registry-iter",
  "magicmock-factory",
  "async-cm-enter",
  "local-pings",
  "flask-extensions",
  "register-value-enter",
  "stringified-annotations",
  "fastapi-get-registry",
  "suppress-context-exit",
  "autowire",
]

included = [
  "registry-iter",
  "magicmock-factory",
  "async-cm-enter",
  "local-pings",
  "flask-extensions",
  "stringified-annotations",
  "fastapi-get-registry",
  "suppress-context-exit",
  "autowire",
]

[excluded]
register-value-enter = """
The base PASSES this commit's own oracle, 6 of 6, so there is nothing for an executor to fix that the tests would notice. The commit changes the register_value() enter default across the core registry and the aiohttp, flask, and pyramid integrations, but the only test file it touches is tests/integrations/test_aiohttp.py, and that file passes unchanged against the base. Its assertions do not depend on the default. A replay task needs an oracle that rejects the base; this one cannot be built from what the commit actually asserts, and inventing tests to make it discriminate would be authoring the oracle rather than replaying the commit."""

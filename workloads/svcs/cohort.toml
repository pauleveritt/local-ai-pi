# The svcs replay cohort.
#
# `tasks` is the candidate ladder -- everything qualification runs against.
# `included` and `excluded` are the frozen *result* of that run, and an
# exclusion without a written reason is not allowed to exist: "record every
# exclusion" is a property of this file's shape rather than something to
# remember at write-up time.
#
# Both lists are empty until Task 8 curates and qualifies. Once frozen,
# running with --frozen requires every candidate to appear in exactly one
# of them.
name = "svcs"
upstream = "https://github.com/hynek/svcs"
env = "env"

# Where this repository keeps its tests.
#
# A write here is permitted and recorded, but never executed and never an
# acceptance failure. Every one of this cohort's eight target commits writes
# tests, so a policy of `src/svcs/**` alone forbids precisely what the
# reference answer does on every task -- and a rule the reference answer
# violates rejects every correct answer, which is how grading rule 4 died.
#
# Repository-level, not per-task, so this adds nothing to a frozen manifest.
# `docs/examples/**` is here because svcs runs those files as tests;
# `typing_tests/**` likewise. Both are touched by `fastapi-get-registry`'s
# target commit. Prose under `docs/` is *not* here and remains a violation.
test_paths = [
  "tests/**",
  "conftest.py",
  "typing_tests/**",
  "docs/examples/**",
]

tasks = [
  "registry-iter",
  "magicmock-factory",
  "async-cm-enter",
  "local-pings",
  "flask-extensions",
  "register-value-enter",
  "stringified-annotations",
  "fastapi-get-registry",
  "suppress-context-exit",
  "autowire",
]

included = [
  "registry-iter",
  "magicmock-factory",
  "async-cm-enter",
  "local-pings",
  "flask-extensions",
  "stringified-annotations",
  "fastapi-get-registry",
  "autowire",
]

[excluded]
suppress-context-exit = """
Unwinnable under the grading rule, proved by the ceiling replay: the target's own diff, restricted to the writable paths, closes the whole oracle gap (12 -> 15) and still fails three base tests in tests/test_registry.py. The new option adds a sixth positional field to RegisteredService and a line to its __repr__, and base tests both construct that record positionally and assert its exact repr. Upstream adapted tests/test_registry.py in the same commit, but that file is not one of this task's oracle files, so preservation holds a candidate to the un-adapted assertions. Any correct implementation is graded as repository damage; no executor can be accepted here.

Excluded rather than renarrowed. A model attempt has already been made on this task, so the freeze rule applies: adding tests/test_registry.py to oracle_files after seeing a run would be rewriting the scope to fit the result, and it would delete those assertions from the preservation surface without moving them into anything the oracle checks."""
register-value-enter = """
The base PASSES this commit's own oracle, 6 of 6, so there is nothing for an executor to fix that the tests would notice. The commit changes the register_value() enter default across the core registry and the aiohttp, flask, and pyramid integrations, but the only test file it touches is tests/integrations/test_aiohttp.py, and that file passes unchanged against the base. Its assertions do not depend on the default. A replay task needs an oracle that rejects the base; this one cannot be built from what the commit actually asserts, and inventing tests to make it discriminate would be authoring the oracle rather than replaying the commit."""

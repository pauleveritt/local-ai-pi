# The 2026-08-11 re-plan's step-4 executor cell: the real implementer
# extension (extensions/implementer/implementer.ts), not a probe or the
# bare envelope. `read` is Pi's built-in; `write` and `edit` are both
# overridden by the extension's registerTool calls and routed through the
# revision-checked mutation engine -- MutationEngine.propose() for whole-
# file writes, MutationEngine.proposeEdits() for the diff-shaped path this
# cell exists to exercise. No raw `bash`.
#
# max_tokens 32768, not the 8192 the bare envelope cells are pinned to.
# That pin belongs to a whole-file-write world the edit path retires, and
# 8192 is not "the server's limit" -- it is `gemma12b-envelope.toml`'s own
# arm-defining choice, frozen there on purpose (see that file's header;
# do not touch it). 32768 is not picked uncritically either: it is the
# exact value `gemma12b-probe-32k.toml` already ran live against this same
# server (omlx, port 8001) and recorded a real completion under -- "early
# `length` deaths fell from 5/6 to 2/8" -- so this is evidenced server
# support, not a copy of the separate (and only partially conclusive)
# 16384 probe. models.json's gemma entry must be pointed at 32768 before
# this cell's verify() will pass; it is not the checked-in default because
# gemma12b-envelope.toml verifies against the same shared models.json
# entry at 8192, and only one value can be live at a time. Bump, verify,
# run, restore -- the same discipline the 16k probe already used.
#
# extensions_sha256 covers implementer.ts's complete same-repo import
# closure -- itself plus the seven files it (transitively) imports:
# extensions/guards/{types,loop-breaker,preserve-symbols}.ts and
# extensions/implementer/{handoff-contract,tool-target,
# implementer-policy,mutation-engine}.ts -- confirmed by reading every
# import line in the chain, not guessed. This was a real gap through
# 432a3e3: the digest covered only implementer.ts's own bytes, matching
# every other cell in this directory (each a single self-contained file),
# but implementer.ts is not self-contained -- an edit to mutation-engine.ts
# changed this arm's real behavior without changing the recorded digest,
# and verify() would have kept passing regardless. tools/deliver_candidate.py's
# IMPLEMENTER_EXTENSION_CLOSURE is the authoritative file list and order;
# recompute both fields here from it, in that order, if the closure's
# membership ever changes -- see that constant's own comment. Pi itself
# still loads only implementer.ts via --extension; this wider set is for
# the digest alone, not a change to what gets loaded.
name = "gemma12b-implementer-v1"
description = """
Gemma 4 12B under the real implementer extension: read/write/edit mediated
by the revision-checked mutation engine, 16-turn / 30-tool caps enforced
by the extension itself (not envelope-cap.ts). Drives
`tools/deliver_candidate.py --cell gemma12b-implementer-v1 --contract-task
<task>`. Pilot smoke only -- see the 2026-08-11 re-plan's step 5. Live
pilot results recorded under this cell: stringified-annotations 6/6
candidate-created and real-oracle-passed across two rounds;
flask-extensions 3/4 candidate-created, 3/3 real-oracle-passed (after
fixing a validation-harness defect that had wrongly zeroed it, see
harness/typed_contract.py); local-pings 5/6 candidate-created, 1/6
real-oracle-passed; autowire 4/4 candidate-created (0/2 before its own
writable-scope fix), 0/4 real-oracle-passed (a genuine capability
ceiling, not a harness artifact). None of this is confirmatory --
governing rule 8.
"""

[pinned]
model = "omlx/gemma-4-12B-it-MLX-8bit"
tools = "read,write,edit"
extensions = "types.ts,loop-breaker.ts,preserve-symbols.ts,handoff-contract.ts,tool-target.ts,implementer-policy.ts,mutation-engine.ts,implementer.ts"
extensions_sha256 = "2aa5921ab2a2b749a700f22db7bbf665479562590bf2cee88d64f5bf44d602c3"
wall_clock_seconds = "900.0"
max_tokens = "32768"
context_window = "80000"
base_url = "http://127.0.0.1:8001/v1"

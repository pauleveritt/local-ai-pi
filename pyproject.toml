[project]
name = "satyrn-engine"
version = "0.1.0"
description = "An eval harness for keeping small local models on track during Python development"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]==0.115.10",
    "pytest==8.3.4",
    "turbohtml==1.5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.8",
    "pyrefly>=1.1.1",
]
docs = [
    "sphinx>=9.1.0",
    "furo>=2025.12.19",
    "myst-parser>=5.0.0",
    "sphinx-autobuild>=2025.8.25",
]

[tool.pytest.ini_options]
# .worktrees holds linked worktrees kept as local state by cycle 17 --
# including the preserved pre-restructure project, whose acceptance
# suites do `from app import app` and only collect inside a grading
# directory. They are another checkout, not this one's tests.
#
# examples/duration's acceptance suite does `from duration import
# parse_duration` the same way -- it only collects inside a grading
# workspace where source_allowlist has copied duration.py alongside it.
norecursedirs = ["examples/agentclinic", "examples/duration", "improvements", "docs/_build", ".worktrees"]

[tool.ruff]
# examples/agentclinic and examples/duration hold fixtures that are
# deliberately broken or hostile, or reference solutions with imports
# that only resolve inside a grading workspace -- they are data for the
# grader, not project source, and must not be linted as if they were.
extend-exclude = ["examples/agentclinic", "examples/duration", "improvements"]

[tool.ruff.lint]
# Proportionate, not maximalist: correctness and clarity rules a
# 5-h/wk contributor benefits from, without a style debate.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade -- keeps us on modern syntax for the pinned version
    "B",    # bugbear
    "SIM",  # simplify
]
# Line length is the one rule we decline. Several tests carry literal
# results-file content and contract strings where a wrap would hurt
# readability rather than help it. Everything else in E stays -- E402
# in particular, which caught test_grading.py having grown imports in
# three places across six cycles.
ignore = ["E501"]

[tool.pyrefly]
project-includes = ["harness", "tests"]

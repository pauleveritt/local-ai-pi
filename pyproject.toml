[project]
name = "local-ai-pi"
version = "0.1.0"
description = "A course on keeping small local models on track under the Pi agent harness"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["."]
# Load-bearing — the reference solution fixture (tests/test_app.py) must
# never be collected as a project test. Removing this line causes collection
# to fail with "import file mismatch" or "RuntimeError: starlette.testclient
# requires httpx2". See tests/test_oracle.py and the oracle-invalid incident
# report.
norecursedirs = ["examples/reference", "examples/acceptance"]
markers = [
    "pi_available: tests that need the pi binary and a running model server",
]

[dependency-groups]
docs = [
    "sphinx>=9.1.0",
    "furo>=2025.12.19",
    "myst-parser>=5.0.0",
    "sphinx-autobuild>=2025.8.25",
]

[project]
name = "satyrn-engine"
version = "0.1.0"
description = "An eval harness for keeping small local models on track during Python development"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]==0.115.10",
    "pytest==8.3.4",
    "turbohtml==1.5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.8",
    "pyrefly>=1.1.1",
]
docs = [
    "sphinx>=9.1.0",
    "furo>=2025.12.19",
    "myst-parser>=5.0.0",
    "sphinx-autobuild>=2025.8.25",
]

[tool.pytest.ini_options]
norecursedirs = ["examples/agentclinic", "docs/_build"]

[tool.ruff]
# examples/agentclinic holds fixtures that are deliberately broken or
# hostile -- they are data for the grader, not project source, and must
# not be linted as if they were.
extend-exclude = ["examples/agentclinic"]

[tool.ruff.lint]
# Proportionate, not maximalist: correctness and clarity rules a
# 5-h/wk contributor benefits from, without a style debate.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade -- keeps us on modern syntax for the pinned version
    "B",    # bugbear
    "SIM",  # simplify
]

[tool.pyrefly]
project-includes = ["harness", "tests"]
